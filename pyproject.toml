[project]
name = "ai-sales"
version = "0.2.0"
description = "LangGraph AI sales agent with lead scoring and human-in-the-loop discount approval"
authors = [
    {name = "Nocturne", email = "tsnaretampandaeng099@outlook.co.th"}
]
requires-python = ">=3.11,<3.14"
dependencies = [
    "langchain (>=1.3.4,<2.0.0)",
    "langgraph (>=1.2.4,<2.0.0)",
    "langchain-google-genai (>=4.2.4,<5.0.0)",
    "langchain-text-splitters (>=1.1.2,<2.0.0)",
    "python-dotenv (>=1.2.2,<2.0.0)",
    "pinecone (>=7.0,<8.0)",
    "langchain-pinecone (>=0.2.13,<0.3.0)",
    "pypdf (>=6.13.0,<7.0.0)",
    "langchain-community (>=0.4.2,<0.5.0)",
    "fastapi (>=0.115.0,<0.116.0)",
    "uvicorn[standard] (>=0.34.0,<0.35.0)",
    "qrcode[pil] (>=8.2,<9.0)",
    "psycopg[binary]>=3.3.4",
    "psycopg-pool>=3.3.1",
    "langgraph-checkpoint-postgres>=3.1.0",
]

[project.scripts]
ai-sales = "ai_sales.__main__:main"


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "black (>=26.5.1,<27.0.0)",
    "isort (>=8.0.1,<9.0.0)",
    "pytest (>=9.0.3,<10.0.0)",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.black]
line-length = 88
target-version = ["py311"]

[tool.isort]
profile = "black"
line_length = 88
